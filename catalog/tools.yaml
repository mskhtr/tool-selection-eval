# 全方式で共通のツールカタログ。version: catalog-2
# ツールは3個。はんだの亀裂進展、はんだの寿命、金属の疲労寿命。
# LLMに渡す項目: id, name, domain, target, purpose, method, aliases,
#   inputs, input_conditions, constraints, outputs, differences, purpose_signals
# B方式だけが追加で使う項目: rule_keywords
# 表記ゆれ（はんだ・半田・ハンダ、亀裂・き裂）は別名と目的の手がかりに書く。
# ファミリー定義は config/method_b.yaml にあり、LLMプロンプトには入れない。
version: catalog-2
tools:
  - id: solder_crack_propagation
    name: はんだ亀裂進展シミュレーション
    domain: 電子実装
    target: はんだ接合部
    purpose: はんだ接合の亀裂が、繰り返し負荷でどこまで進むかを模擬する
    method: はんだ接合を対象にした亀裂進展シミュレーション
    aliases:
      - はんだ亀裂進展
      - 半田亀裂進展
      - ハンダ亀裂進展
      - 半田き裂進展
      - ハンダき裂進展
    inputs: [はんだ形状, 温度サイクルまたは負荷履歴]
    input_conditions: [対象がはんだ接合であること, 亀裂の進み方を見ること]
    constraints: [金属母材の疲労寿命ではない, 寿命サイクル数だけが欲しい場合の専用手続きではない]
    outputs: [亀裂長さの推移, 進展経路]
    differences: はんだ寿命予測は破断までの回数を出す。こちらは亀裂の進み方を出す。金属の疲労寿命予測とは対象が違う。
    purpose_signals: [亀裂進展, き裂進展, 進展量]
    rule_keywords: [亀裂, き裂]

  - id: solder_life_prediction
    name: はんだ寿命予測シミュレーション
    domain: 電子実装
    target: はんだ接合部
    purpose: はんだ接合が何回の温度サイクルで寿命に達するかを予測する
    method: はんだの寿命則による寿命予測
    aliases:
      - はんだ寿命予測
      - はんだ寿命
      - はんだの寿命
      - 半田寿命
      - 半田の寿命
      - ハンダ寿命
      - ハンダの寿命
    inputs: [温度サイクル条件, はんだ仕様]
    input_conditions: [対象がはんだ接合であること, 寿命回数を求めること]
    constraints: [亀裂形状の進展そのものを追わない, 金属部材の高サイクル疲労寿命ではない]
    outputs: [寿命サイクル数]
    differences: はんだ亀裂進展は亀裂の伸びを見る。こちらは寿命回数を見る。疲労寿命予測は金属部材のS-N疲労を見る。
    purpose_signals: [はんだ寿命, 半田寿命, ハンダ寿命, 熱疲労寿命, 寿命に達する]
    rule_keywords: [寿命]

  - id: fatigue_life
    name: 疲労寿命予測
    domain: 構造強度
    target: 金属部材
    purpose: 金属部材の繰り返し荷重に対する疲労寿命を予測する
    method: S-Nなどの疲労寿命評価
    aliases:
      - 疲労寿命予測
      - 疲労寿命
      - 高サイクル疲労
    inputs: [繰り返し荷重, S-N特性]
    input_conditions: [対象が金属部材の疲労であること, はんだ専用の寿命則ではないこと]
    constraints: [はんだ接合の熱疲労寿命専用ではない, はんだの亀裂進展を追う手続きではない]
    outputs: [疲労寿命]
    differences: はんだ寿命予測ははんだ接合の温度サイクル寿命を見る。はんだ亀裂進展は接合部の亀裂の伸びを見る。
    purpose_signals: [疲労寿命, 高サイクル疲労, sn, 疲労]
    rule_keywords: [寿命]
