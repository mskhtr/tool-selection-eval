# 語はカタログの名称と目的に書いてあるものだけ。
# テスト文の俗語（ソルダ、クラック、クラックグロース、割れ、持たない、折れ）は入れない。
version: ontology-2
concepts:
  solder:
    labels: [はんだ, 半田, ハンダ]
  crack:
    labels: [亀裂, き裂]
  propagation:
    labels: [進展, 進む]
  life:
    labels: [寿命]
  thermal:
    labels: [熱疲労]
  fatigue:
    labels: [疲労, 高サイクル疲労]
  metal:
    labels: [金属]
  sn:
    labels: [sn]
tool_requirements:
  solder_crack_propagation:
    - [solder, crack]
    - [crack, propagation]
  solder_life_prediction:
    - [solder, life]
    - [thermal, life]
  fatigue_life:
    - [fatigue, life]
    - [sn]
    - [fatigue]
subject_only:
  solder: [solder_crack_propagation, solder_life_prediction]
  life: [solder_life_prediction, fatigue_life]
