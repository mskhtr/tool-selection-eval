# オントロジー。辞書の語を概念にまとめ、関係でツールへ結ぶ。
# 割れ・持たない・折れは示唆であり、それだけでは目的を一つに決めない。
# 事務語と依頼の語は B と同じ門を使う。候補の決め方だけが関係である。
version: ontology-1
concepts:
  solder:
    labels: [はんだ, 半田, ハンダ, ソルダ, bga]
  crack:
    labels: [亀裂, き裂, クラック]
  propagation:
    labels: [進展, 進む, 進み, グロース]
  life:
    labels: [寿命]
  thermal:
    labels: [熱疲労]
  fatigue:
    labels: [疲労, 高サイクル疲労]
  metal:
    labels: [金属, 鋼]
  sn:
    labels: [sn]
suggestions:
  crack: [割れ]
  life: [持たない, 折れ]
tool_requirements:
  solder_crack_propagation:
    - [solder, crack]
    - [crack, propagation]
  solder_life_prediction:
    - [solder, life]
    - [thermal, life]
  fatigue_life:
    - [fatigue, life]
    - [metal, life]
    - [sn]
    - [fatigue]
subject_only:
  solder: [solder_crack_propagation, solder_life_prediction]
  life: [solder_life_prediction, fatigue_life]
