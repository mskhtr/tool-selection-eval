# 呼び方を教えた辞書に、設計者独自の言い方を足す。
# 割れは亀裂進展の別名、持たないははんだ寿命の別名。一つに決めない、とは書いていない。
# 折れは入れない。
version: b-rules-slang-1
request_substrings:
  - 解析
  - シミュレーション
  - 計算
  - 予測
  - 評価
  - 見たい
  - 見て
  - 知りたい
  - 調べ
  - 実行
  - 回して
  - 回し
  - 出して
  - 出し
  - 求め
  - やって
  - やっと
  - お願い
  - ちょうだい
  - したい
  - やりたい
  - 確認
  - 比較
  - 取って
combination_substrings:
  - 両方
  - いずれも
  - それぞれ
  - 続けて
  - 比較
  - そのあと
  - ついで
# これらが含まれる入力は、解析実行ではなく説明・事務・検索とみなして保留する。
hard_meta_substrings:
  - 意味
  - 文献
  - 参考資料
  - 日程
  - スケジュール
  - 会議
  - 打ち合わせ
  - メール
  - フォルダ
  - 写真
  - 目次
  - 報告書
  - 天気
  - 手順
  - 予約
  - ライセンス
  - 探して
  - 整理して
  - 化学分析
  - 工数
  - 見積
  - 使い方
  - 更新日
families:
  solder:
    triggers: [はんだ, 半田, ハンダ, ソルダ]
    tools: [solder_crack_propagation, solder_life_prediction]
extra_aliases:
  solder_crack_propagation: [クラックグロース, クラック, 割れ]
  solder_life_prediction: [持たない]
